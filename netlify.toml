[build]
  publish = "."
  functions = "netlify/functions"

# Artifact sources live in the repo but are not part of the public site
[[redirects]]
  from = "/artifacts/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/portal"
  to   = "/portal.html"
  status = 200

[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200
